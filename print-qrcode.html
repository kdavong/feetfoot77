<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>QR Code FeetFoot77 (Version Bleue)</title>
  <style>
    @page {
      size: A4 portrait;
      margin: 2cm;
    }
    body {
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
      background: #ffffff;
      color: #0055b3; /* Bleu moyen, pas d'encre noire */
      margin: 0;
      padding: 40px 20px;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
      border: 3px dashed #0066cc;
      border-radius: 20px;
      padding: 30px 20px;
    }
    h1 {
      font-size: 32px;
      margin: 0 0 10px 0;
      color: #0055b3;
    }
    p {
      font-size: 18px;
      margin: 8px 0;
      color: #0066cc;
    }
    .qr-frame {
      margin: 24px auto;
      display: inline-block;
      padding: 14px;
      background: #ffffff;
      border: 4px solid #0066cc;
      border-radius: 16px;
    }
    .qr-frame img {
      display: block;
      width: 320px;
      height: 320px;
    }
    .handle {
      font-size: 26px;
      font-weight: bold;
      color: #004499;
      margin-top: 15px;
    }
    .url {
      font-size: 15px;
      color: #0077ee;
      margin-top: 6px;
    }
    @media print {
      body {
        padding: 0;
      }
      .no-print {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="no-print" style="margin-bottom: 20px;">
    <button onclick="window.print()" style="font-size: 18px; padding: 10px 24px; background: #0066cc; color: white; border: none; border-radius: 8px; cursor: pointer;">
      🖨️ Imprimer la feuille (Ctrl + P)
    </button>
  </div>

  <div class="container">
    <h1>🎃 HALLOWEEN 2026 👟</h1>
    <p>Scannez pour liker la Chaussure Géante !</p>
    
    <div class="qr-frame">
      <img src="qrcode-feetfoot77.png" alt="QR Code FeetFoot77" />
    </div>

    <div class="handle">@FEETFOOT77</div>
    <div class="url">https://kdavong.github.io/feetfoot77/</div>
  </div>
</body>
</html>
